[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-tail-characterization"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2", "scipy>=1.15", "matplotlib>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pam-waveform = "dual_tail_characterization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
